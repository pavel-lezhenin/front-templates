name: Feature Branch CI

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  basic-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  create-pull-request:
    needs: [basic-checks]
    if: |
      always() && 
      needs.basic-checks.result == 'success' &&
      !contains(github.event.head_commit.message, '[skip-pr]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Create Pull Request
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          
          if [[ "$EXISTING_PR" != "null" && "$EXISTING_PR" != "" ]]; then
            echo "✅ Pull Request already exists: #$EXISTING_PR"
          else
            COMMIT_MSG=$(git log -1 --pretty=format:"%s")
            COMMIT_BODY=$(git log -1 --pretty=format:"%b")
            
            PR_BODY="$COMMIT_BODY"$'\n\n'"## 🤖 Auto-generated PR"$'\n\n'"This pull request was automatically created by the CI system."$'\n\n'"**Validation Status:**"$'\n'"- ✅ Security scan passed"$'\n'"- ✅ Code quality checks passed"$'\n\n'"---"$'\n'"*Generated from commit: ${{ github.sha }}*"
            
            gh pr create \
              --title "$COMMIT_MSG" \
              --body "$PR_BODY" \
              --head "$BRANCH_NAME" \
              --base "main"
            
            echo "🎉 Created Pull Request"
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

  notify-success:
    needs: [basic-checks, create-pull-request]
    if: always() && needs.basic-checks.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "✅ Feature branch CI completed successfully"
