name: Feature Branch CI

on:
  push:
    branches-ignore: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install root dependencies
        run: pnpm install

      - name: Format check
        run: pnpm format:check

      - name: Lint root
        run: pnpm lint

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            react-fsd-starter:
              - 'packages/react-fsd-starter/**'
            angular-standalone-orders:
              - 'packages/angular-standalone-orders/**'

      - name: Check if has changes
        id: check
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          if [[ "$CHANGES" != "[]" && "$CHANGES" != "" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  trigger-submodule-ci:
    needs: [root-checks, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Trigger submodule CI
        run: |
          echo "🚀 Triggering CI for ${{ matrix.package }}"
          
          gh api repos/${{ github.repository_owner }}/${{ matrix.package }}/dispatches \
            -f event_type=parent_trigger \
            -F client_payload[parent_run_id]=${{ github.run_id }} \
            -F client_payload[parent_sha]=${{ github.sha }}
          
          echo "✅ Dispatch sent to ${{ matrix.package }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  wait-for-submodule-ci:
    needs: [detect-changes, trigger-submodule-ci]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Wait for submodule CI
        run: |
          echo "⏳ Waiting for ${{ matrix.package }} CI..."
          
          sleep 30
          
          for i in {1..30}; do
            echo "Checking... ($i/30)"
            
            RESPONSE=$(gh api repos/${{ github.repository_owner }}/${{ matrix.package }}/actions/runs \
              -q '.workflow_runs | map(select(.event == "repository_dispatch")) | .[0] | {status, conclusion}' 2>/dev/null || echo '{}')
            
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "pending"')
            CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion // "null"')
            
            echo "Status: $STATUS, Conclusion: $CONCLUSION"
            
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ ${{ matrix.package }} CI passed!"
                exit 0
              else
                echo "❌ ${{ matrix.package }} CI failed: $CONCLUSION"
                exit 1
              fi
            fi
            
            sleep 20
          done
          
          echo "❌ Timeout waiting for ${{ matrix.package }} CI"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  create-pull-request:
    needs: [root-checks, detect-changes]
    if: |
      always() && 
      needs.root-checks.result == 'success' &&
      !contains(github.event.head_commit.message, '[skip-pr]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          fetch-depth: 0

      - name: Create Pull Request
        run: |
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          
          if [[ "$EXISTING_PR" != "null" && "$EXISTING_PR" != "" ]]; then
            echo "✅ Pull Request already exists: #$EXISTING_PR"
          else
            COMMIT_MSG=$(git log -1 --pretty=format:"%s")
            
            PR_BODY="## 🤖 Auto-generated PR

          **Validation Status:**
          - ✅ Root checks passed
          - ✅ Security scan passed
          - ✅ Submodule CI passed (if applicable)

          ---
          *Generated from commit: ${{ github.sha }}*"
            
            if gh pr create --title "$COMMIT_MSG" --body "$PR_BODY" --head "$BRANCH_NAME" --base "main"; then
              echo "🎉 Created Pull Request"
            else
              echo "⚠️ Could not auto-create PR. Create manually:"
              echo "https://github.com/${{ github.repository }}/pull/new/$BRANCH_NAME"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

  notify-success:
    needs: [root-checks, detect-changes, create-pull-request]
    if: always() && needs.root-checks.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "✅ Feature branch CI completed"
