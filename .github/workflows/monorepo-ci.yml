name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  actions: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  root-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Security audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            react-fsd-starter:
              - 'packages/react-fsd-starter/**'

      - name: Check if has changes
        id: check
        run: |
          CHANGES='${{ steps.filter.outputs.changes }}'
          if [[ "$CHANGES" != "[]" && "$CHANGES" != "" ]]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

  trigger-submodule-ci:
    needs: [root-checks, security, detect-changes]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Trigger submodule CI
        run: |
          echo "🚀 Triggering CI for ${{ matrix.package }}"
          
          gh api repos/${{ github.repository_owner }}/${{ matrix.package }}/dispatches \
            -f event_type=parent_trigger \
            -F client_payload[parent_run_id]=${{ github.run_id }} \
            -F client_payload[parent_sha]=${{ github.sha }}
          
          echo "✅ Dispatch sent to ${{ matrix.package }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  wait-for-submodule-ci:
    needs: [detect-changes, trigger-submodule-ci]
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Wait for submodule CI
        run: |
          echo "⏳ Waiting for ${{ matrix.package }} CI..."
          
          # Wait a bit for the workflow to start
          sleep 30
          
          for i in {1..30}; do
            echo "Checking... ($i/30)"
            
            # Get latest workflow run triggered by repository_dispatch
            RESPONSE=$(gh api repos/${{ github.repository_owner }}/${{ matrix.package }}/actions/runs \
              -q '.workflow_runs | map(select(.event == "repository_dispatch")) | .[0] | {status, conclusion}' 2>/dev/null || echo '{}')
            
            STATUS=$(echo "$RESPONSE" | jq -r '.status // "pending"')
            CONCLUSION=$(echo "$RESPONSE" | jq -r '.conclusion // "null"')
            
            echo "Status: $STATUS, Conclusion: $CONCLUSION"
            
            if [[ "$STATUS" == "completed" ]]; then
              if [[ "$CONCLUSION" == "success" ]]; then
                echo "✅ ${{ matrix.package }} CI passed!"
                exit 0
              else
                echo "❌ ${{ matrix.package }} CI failed: $CONCLUSION"
                exit 1
              fi
            fi
            
            sleep 20
          done
          
          echo "❌ Timeout waiting for ${{ matrix.package }} CI"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}

  notify-success:
    needs: [root-checks, security, detect-changes, wait-for-submodule-ci]
    if: |
      always() && 
      needs.root-checks.result == 'success' && 
      needs.security.result == 'success' &&
      (needs.detect-changes.outputs.has_changes != 'true' || needs.wait-for-submodule-ci.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "✅ All checks passed"
