name: Monorepo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read          # Read repository contents
  pull-requests: write    # Create and update PRs
  actions: read          # Read workflow runs
  security-events: write # Upload security scan results

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed packages
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            react-fsd-starter:
              - 'packages/react-fsd-starter/**'
            react-fsd-tanstack:
              - 'packages/react-fsd-tanstack/**'
            angular-modular-starter:
              - 'packages/angular-modular-starter/**'

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        run: pnpm audit --audit-level=high

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trigger-submodules:
    needs: [detect-changes, security]
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Trigger submodule CI
        run: |
          echo "🚀 Triggering CI for ${{ matrix.package }}"
          
          # Check if repository exists
          if ! gh api repos/${{ github.repository_owner }}/${{ matrix.package }} > /dev/null 2>&1; then
            echo "⚠️  Repository ${{ github.repository_owner }}/${{ matrix.package }} not found or not accessible"
            echo "Skipping CI trigger for ${{ matrix.package }}"
            exit 0
          fi
          
          # Trigger repository dispatch
          gh api repos/${{ github.repository_owner }}/${{ matrix.package }}/dispatches \
            -f event_type=parent_repo_update \
            -F client_payload[parent_run_id]=${{ github.run_id }} \
            -F client_payload[parent_repo]=${{ github.repository }} \
            -F client_payload[parent_ref]=${{ github.ref }}
          
          echo "✅ Successfully triggered CI for ${{ matrix.package }}"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

  wait-for-submodules:
    needs: [detect-changes, trigger-submodules]
    if: needs.detect-changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.packages) }}
    steps:
      - name: Wait for submodule CI
        run: |
          echo "🔍 Checking CI status for ${{ matrix.package }}"
          
          # Check if we can access the repository
          if ! gh api repos/${{ github.repository_owner }}/${{ matrix.package }} > /dev/null 2>&1; then
            echo "⚠️  Repository ${{ github.repository_owner }}/${{ matrix.package }} not accessible"
            echo "Skipping CI wait for ${{ matrix.package }}"
            exit 0
          fi
          
          for i in {1..60}; do
            echo "⏳ Waiting for ${{ matrix.package }} CI... ($i/60)"
            
            # Get latest workflow run status
            response=$(gh api repos/${{ github.repository_owner }}/${{ matrix.package }}/actions/runs \
              --jq '.workflow_runs[0] | {status: .status, conclusion: .conclusion}' 2>/dev/null || echo '{"status": "unknown"}')
            
            status=$(echo "$response" | jq -r '.status')
            
            if [[ "$status" == "completed" ]]; then
              conclusion=$(echo "$response" | jq -r '.conclusion')
              
              if [[ "$conclusion" == "success" ]]; then
                echo "✅ ${{ matrix.package }} CI passed"
                exit 0
              else
                echo "❌ ${{ matrix.package }} CI failed with conclusion: $conclusion"
                exit 1
              fi
            elif [[ "$status" == "unknown" ]]; then
              echo "⚠️  Unable to get CI status, assuming success"
              exit 0
            fi
            
            sleep 10
          done
          
          echo "❌ Timeout waiting for ${{ matrix.package }} CI (10 minutes)"
          echo "Last known status: $status"
          exit 1
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

  create-pull-request:
    runs-on: ubuntu-latest
    if: false  # Disabled - handled by feature-branch-ci.yml
    steps:
      - name: Placeholder
        run: echo "PR creation handled by feature-branch-ci.yml"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Create Pull Request
        run: |
          # Extract branch name
          BRANCH_NAME=${GITHUB_REF#refs/heads/}
          
          # Check if PR already exists
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --json number --jq '.[0].number')
          
          if [[ "$EXISTING_PR" != "null" && "$EXISTING_PR" != "" ]]; then
            echo "✅ Pull Request already exists: #$EXISTING_PR"
            echo "pr_number=$EXISTING_PR" >> $GITHUB_OUTPUT
          else
            # Extract commit info for PR details
            COMMIT_MSG=$(git log -1 --pretty=format:"%s")
            COMMIT_BODY=$(git log -1 --pretty=format:"%b")
            
            # Create PR with conventional commit format
            PR_NUMBER=$(gh pr create \
              --title "$COMMIT_MSG" \
              --body "$COMMIT_BODY

              ## 🤖 Auto-generated PR
              
              This pull request was automatically created by the CI system.
              
              **Changes:**
              - Automated CI/CD improvements
              - Security and workflow enhancements
              
              **Validation:**
              - ✅ Security scan passed
              - ✅ Submodule workflows triggered
              
              ---
              *Generated from commit: ${{ github.sha }}*" \
              --head "$BRANCH_NAME" \
              --base "main" \
              --json number --jq '.number')
            
            echo "🎉 Created Pull Request: #$PR_NUMBER"
            echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          fi
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}

  notify-success:
    needs: [security]
    if: always() && needs.security.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Success
        run: echo "✅ All checks passed"
