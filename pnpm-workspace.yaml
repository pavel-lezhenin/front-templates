packages: []

# NOTE: This file is minimal because this is a GIT SUBMODULE monorepo, NOT a pnpm workspace.
#
# Each package (packages/*) is an independent git repository with:
# - Its own .git directory and git history
# - Its own pnpm-lock.yaml (independent lockfile)
# - Its own package.json and dependencies
# - Its own CI/CD pipeline
#
# Packages are managed via git submodules, not pnpm workspace filtering.
# Work on each package independently by navigating to its directory.
#
# Root only manages:
# - Shared dev tools (prettier, eslint, husky)
# - Git configuration
# - Monorepo-level documentation

